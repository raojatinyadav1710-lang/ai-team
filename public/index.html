<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Carlito looks the same as Calibri; used only on devices that don't have Calibri -->
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--line:#2a2a2a;--mute:#8a8a8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#000;color:#f2f2f2;font:17px/1.5 Calibri,Carlito,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{font-size:20px;margin-right:auto;letter-spacing:.3px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mute);padding:6px 16px;font:inherit;cursor:pointer}
.seg .on{background:#f2f2f2;color:#000}
select,textarea{background:#0d0d0d;color:inherit;border:1px solid var(--line);border-radius:12px;font:inherit;padding:8px 10px;outline:none}
select{max-width:130px}
main{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:18px}
.wrap{width:100%;max-width:820px;margin:0 auto}
.m{max-width:100%;word-wrap:break-word}
.u{align-self:flex-end;background:#161616;border:1px solid var(--line);border-radius:16px;padding:8px 14px;max-width:85%}
.by{color:var(--mute);font-size:14px;margin-bottom:2px}
.note{color:var(--mute);font-size:14px;margin-top:4px}
.hint{color:var(--mute);text-align:center;margin-top:12vh}
pre{background:#0d0d0d;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:8px 0}
code{font-family:Consolas,ui-monospace,monospace;font-size:14px}
details{margin-top:10px;color:var(--mute);font-size:15px}
details summary{cursor:pointer}
details p{color:#d0d0d0;margin:8px 0}
footer{border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;color:#d0d0d0}
.chip a{cursor:pointer;margin-left:4px;color:var(--mute)}
form{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px}
.attach,#send{border:1px solid var(--line);border-radius:12px;height:42px;min-width:42px;display:grid;place-items:center;cursor:pointer;font:inherit;background:#0d0d0d;color:inherit}
#send{background:#f2f2f2;color:#000;border:0;padding:0 18px}
#send:disabled{opacity:.4}
</style>
</head>
<body>
<header>
  <b class="logo">AI Team</b>
  <div class="seg"><button id="bSolo" class="on" type="button">Solo</button><button id="bTeam" type="button">Team</button></div>
  <select id="model" aria-label="Choose AI"></select>
</header>

<main id="chat"><div class="wrap" id="log"><div class="hint" id="hint"></div></div></main>

<footer><div class="wrap">
  <div id="chips"></div>
  <form id="f">
    <label class="attach" title="Attach an image or text file">+<input id="file" type="file" hidden multiple></label>
    <textarea id="in" rows="1" placeholder="Message..."></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div></footer>

<script>
const $ = s => document.querySelector(s);
const log = $('#log');
let mode = 'solo', hist = [], files = [], busy = false, needsCode = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Tiny safe formatter: code blocks, `inline code`, **bold**, line breaks.
const md = t => String(t).split(/```/).map((part, i) => i % 2
  ? `<pre><code>${esc(part.replace(/^\w*\n/, ''))}</code></pre>`
  : esc(part).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')
).join('');

function add(cls, html) {
  $('#hint')?.remove();
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.innerHTML = html;
  log.appendChild(d);
  $('#chat').scrollTop = $('#chat').scrollHeight;
  return d;
}

function setMode(m) {
  mode = m;
  $('#bSolo').classList.toggle('on', m === 'solo');
  $('#bTeam').classList.toggle('on', m === 'team');
  $('#model').style.display = m === 'solo' ? '' : 'none';
  $('#in').placeholder = m === 'solo' ? 'Message...' : 'Ask your whole AI team...';
  const h = $('#hint');
  if (h) h.textContent = m === 'solo'
    ? 'Solo: pick one AI. If it runs out of credits, the next one takes over.'
    : 'Team: your AIs answer together, then a lead merges the best answer.';
}
$('#bSolo').onclick = () => setMode('solo');
$('#bTeam').onclick = () => setMode('team');

const code = () => localStorage.getItem('code') || '';
function askCode() { const c = prompt('Access code'); if (c) localStorage.setItem('code', c); }

async function init() {
  setMode('solo');
  try {
    const j = await (await fetch('/api/chat')).json();
    needsCode = j.needsCode;
    $('#model').innerHTML = '<option value="">Auto</option>' + j.models.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
    if (!j.models.length) add('a', '<div class="note">No AI keys added yet. Add at least one in your Vercel settings.</div>');
  } catch {}
  if (needsCode && !code()) askCode();
}

const grow = () => { const t = $('#in'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; };
$('#in').oninput = grow;
$('#in').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#f').requestSubmit(); } };

const TEXT_EXT = /\.(txt|md|csv|tsv|json|xml|html?|css|jsx?|tsx?|py|java|c|cpp|h|go|rs|rb|php|sql|ya?ml|toml|ini|log|sh)$/i;
const guessType = f => f.type || (TEXT_EXT.test(f.name) ? 'text/plain' : 'application/octet-stream');

function put(url, file, onp) {
  return new Promise((ok, no) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.upload.onprogress = e => e.lengthComputable && onp(Math.round(e.loaded / e.total * 100));
    x.onload = () => x.status < 300 ? ok() : no(new Error('storage said ' + x.status));
    x.onerror = () => no(new Error('blocked'));
    x.send(file);
  });
}

// Uploads straight from your phone to storage (works up to 1 GB). Small files can also go via the server.
async function upload(f, chip) {
  const skip = [];
  for (;;) {
    const r = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': 'application/json', 'x-access-code': code() }, body: JSON.stringify({ name: f.name, size: f.size, skip }) });
    if (r.status === 401) { localStorage.removeItem('code'); askCode(); throw new Error('Wrong access code'); }
    if (!r.ok) break;
    const j = await r.json();
    try { await put(j.url, f, p => { chip.pct = p; drawChips(); }); return j.id; } catch { skip.push(j.store); }
  }
  if (f.size <= 4 * 1024 * 1024) {
    const r = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': 'application/octet-stream', 'x-filename': encodeURIComponent(f.name), 'x-access-code': code() }, body: f });
    const j = await r.json();
    if (r.ok) return j.id;
    throw new Error(j.error || 'failed');
  }
  throw new Error('Big files need the storage CORS step (see README)');
}

function drawChips() {
  $('#chips').innerHTML = files.map((f, i) => `<span class="chip">${esc(f.name)}${f.id ? (f.sent ? ' &middot; in chat' : '') : ' ' + (f.pct || 0) + '%'} <a data-i="${i}">&times;</a></span>`).join('');
}
$('#chips').onclick = e => { const i = e.target.dataset.i; if (i !== undefined) { files.splice(+i, 1); drawChips(); } };

$('#file').onchange = async e => {
  for (const f of e.target.files) {
    if (f.size > 1024 ** 3) { add('a', `<div class="note">${esc(f.name)} is over 1 GB, skipped.</div>`); continue; }
    const chip = { name: f.name, type: guessType(f), id: null, pct: 0 };
    files.push(chip); drawChips();
    try {
      chip.id = await upload(f, chip);
    } catch (err) {
      files = files.filter(x => x !== chip);
      add('a', `<div class="note">Upload failed: ${esc(err.message)}</div>`);
    }
    drawChips();
  }
  e.target.value = '';
};

$('#f').onsubmit = async e => {
  e.preventDefault();
  const text = $('#in').value.trim();
  if (busy || (!text && !files.length) || files.some(f => !f.id)) return;
  busy = true; $('#send').disabled = true;
  // Pictures are sent once. Documents stay attached, so you can keep asking questions about them.
  const sent = files.slice();
  files = files.filter(f => !/^image\//.test(f.type));
  $('#in').value = ''; grow();

  add('u', esc(text) + sent.filter(f => !f.sent).map(f => `<div class="note">attached: ${esc(f.name)}</div>`).join(''));
  sent.forEach(f => f.sent = true); drawChips();
  const box = add('a', `<div class="note">${mode === 'team' ? 'Team is working...' : 'Thinking...'}</div>`);

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-access-code': code() },
      body: JSON.stringify({ mode, model: $('#model').value, message: text, history: hist.slice(-8), files: sent.map(({ id, name, type }) => ({ id, name, type })) }),
    });
    const j = await r.json();
    if (r.status === 401) { localStorage.removeItem('code'); askCode(); }
    if (!r.ok) throw Object.assign(new Error(j.error || 'Something went wrong'), { notes: j.notes });

    hist.push({ role: 'user', content: text || '(file attached)' }, { role: 'assistant', content: j.reply });
    box.innerHTML =
      `<div class="by">${mode === 'team' ? 'Team &middot; lead ' : ''}${esc(j.by)}</div>${md(j.reply)}` +
      (j.drafts?.length ? `<details><summary>Teammates' answers</summary>${j.drafts.map(d => `<p><b>${esc(d.name)}</b><br>${md(d.text)}</p>`).join('')}</details>` : '') +
      (j.notes?.length ? `<div class="note">${j.notes.map(esc).join('<br>')}</div>` : '');
  } catch (err) {
    box.innerHTML = `<div class="note">${esc(err.message)}</div>` + (err.notes || []).map(n => `<div class="note">${esc(n)}</div>`).join('');
  }
  busy = false; $('#send').disabled = false;
  $('#chat').scrollTop = $('#chat').scrollHeight;
};

init();
</script>
</body>
</html>
